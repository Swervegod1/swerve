name: Trinity AI OS Android Build
on:
  push:
    branches: [trinity-android-v10-1-build]
    paths: ['trinity-build/**', '.github/workflows/trinity-ai-os-build.yml']
  pull_request:
    paths: ['trinity-build/**', '.github/workflows/trinity-ai-os-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack source
        run: |
          mkdir -p trinity-build/project
          base64 -d trinity-build/source.zip.b64 > trinity-build/source.zip
          unzip -q trinity-build/source.zip -d trinity-build/project
      - name: Compile APK
        run: gradle -p trinity-build/project :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TrinityAIOS-v10.1-debug-APK
          path: trinity-build/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
